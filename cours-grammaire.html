<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXL - Francais</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    :root {
      --primary: #A7F3D0;
      --secondary: #34D399;
      --accent: #047857;
      --accent-dark: #064E3B;
      --background: #F8FAFC;
      --text: #0F172A;
      --muted: #64748B;
      --card: #FFFFFF;
      --line: rgba(15, 23, 42, 0.1);
      --shadow: 0 18px 55px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(167, 243, 208, 0.36), transparent 30rem),
        linear-gradient(180deg, #fff 0%, var(--background) 45%);
      color: var(--text);
      font-family: 'Inter', Arial, sans-serif;
    }

    body.dark-mode {
      --background: #0F172A;
      --text: #F8FAFC;
      --muted: #CBD5E1;
      --card: #1E293B;
      --line: rgba(248, 250, 252, 0.12);
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
      background:
        radial-gradient(circle at top left, rgba(4, 120, 87, 0.28), transparent 28rem),
        linear-gradient(180deg, #111827 0%, #0F172A 55%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px clamp(20px, 5vw, 64px);
      background: rgba(255, 255, 255, 0.78);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    body.dark-mode .navbar {
      background: rgba(15, 23, 42, 0.82);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: clamp(12px, 2vw, 24px);
    }

    .nav-links a {
      color: var(--muted);
      font-weight: 800;
    }

    .nav-links a.active,
    .nav-links a:hover {
      color: var(--text);
    }

    .icon-button {
      width: 42px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--card);
      color: var(--text);
    }

    .french-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
      gap: 24px;
      align-items: center;
      padding: clamp(32px, 6vw, 72px) clamp(20px, 5vw, 64px);
      background:
        linear-gradient(135deg, rgba(52, 211, 153, 0.95), rgba(167, 243, 208, 0.86)),
        var(--secondary);
      color: #062f25;
    }

    .eyebrow,
    .panel-kicker {
      margin-bottom: 10px;
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin-bottom: 18px;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      line-height: 0.98;
    }

    .french-hero p {
      max-width: 650px;
      color: rgba(6, 47, 37, 0.78);
      font-size: 1.08rem;
      line-height: 1.55;
    }

    .level-card {
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.55);
    }

    .level-card strong {
      display: block;
      margin-bottom: 14px;
      font-size: 1.3rem;
    }

    .level-card select {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid rgba(6, 78, 59, 0.22);
      border-radius: 999px;
      background: #fff;
      color: #062f25;
      font-weight: 800;
    }

    .page {
      width: min(1180px, calc(100% - 40px));
      margin: 28px auto 52px;
    }

    .branch-tabs {
      position: sticky;
      top: 75px;
      z-index: 10;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    body.dark-mode .branch-tabs {
      background: rgba(30, 41, 59, 0.86);
    }

    .branch-tabs button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      font-weight: 800;
    }

    .branch-tabs button.active {
      border-color: transparent;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: #063d2e;
    }

    .course-grid {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .chapter-nav,
    .branch-panel,
    .chapter-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .chapter-nav {
      position: sticky;
      top: 155px;
      padding: 18px;
    }

    .chapter-nav h2 {
      margin-bottom: 14px;
      font-size: 1.05rem;
    }

    .chapter-nav a {
      display: block;
      padding: 11px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
      line-height: 1.35;
    }

    .chapter-nav a:hover {
      color: var(--accent);
    }

    .branch-panel {
      padding: clamp(18px, 3vw, 28px);
    }

    .branch-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .branch-heading h2 {
      font-size: clamp(1.8rem, 4vw, 2.7rem);
    }

    .branch-heading > i {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(52, 211, 153, 0.14);
      color: var(--accent);
      font-size: 1.8rem;
    }

    .subbranch-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .subbranch-list span {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-weight: 800;
    }

    .chapter-stack {
      display: grid;
      gap: 16px;
    }

    .chapter-card {
      padding: 20px;
      box-shadow: none;
    }

    .chapter-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .chapter-card h3 {
      margin-bottom: 8px;
      font-size: 1.35rem;
    }

    .chapter-card p {
      color: var(--muted);
      line-height: 1.55;
    }

    .primary-btn,
    .light-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      font-weight: 800;
      white-space: nowrap;
    }

    .primary-btn {
      border: 0;
      background: var(--accent);
      color: #fff;
    }

    .light-btn {
      border: 1px solid var(--line);
      background: rgba(52, 211, 153, 0.1);
      color: var(--accent);
    }

    .summary {
      display: none;
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(52, 211, 153, 0.1);
    }

    .summary.open {
      display: block;
    }

    .summary ul,
    .exercise-list {
      padding-left: 20px;
      color: var(--text);
      line-height: 1.65;
    }

    .chapter-actions {
      margin-top: 14px;
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      font-weight: 800;
    }

    @media (max-width: 820px) {
      .navbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
      }

      .french-hero,
      .course-grid {
        grid-template-columns: 1fr;
      }

      .chapter-nav {
        position: static;
      }

      .chapter-top {
        flex-direction: column;
      }

      .primary-btn,
      .light-btn {
        width: 100%;
      }
    }
  </style>
</head>

          chapters: [
            chapter("Enonciation", "Identifier locuteur, destinataire et situation.", ["Repere les pronoms personnels.", "Trouve les marques de temps.", "Explique qui parle a qui."], ["L'enonciation situe la parole.", "Les deictiques dependent de la situation.", "Le locuteur peut etre different de l'auteur."]),
            chapter("Syntaxe de la phrase complexe", "Analyser coordination, juxtaposition et subordination.", ["Separe les propositions.", "Nomme le lien entre deux propositions.", "Transforme une juxtaposition en subordination."], ["La syntaxe montre les relations logiques.", "Les conjonctions signalent souvent le lien.", "Une phrase complexe contient plusieurs noyaux verbaux."]),
            chapter("Precision du lexique", "Choisir les mots justes pour analyser.", ["Remplace un verbe vague.", "Trouve un synonyme plus precis.", "Classe un champ lexical."], ["Le lexique oriente le sens.", "Un mot precis evite les generalites.", "Le champ lexical revele un theme ou une atmosphere."])
          ]
        }
      ]
    };

    function chapter(title, goal, exercises, summary) {
      return { title, goal, exercises, summary };
    }

    function profileForLevel(level) {
      if (["ce1", "ce2", "cm1", "cm2"].includes(level)) return "primaire";
      if (["6eme", "5eme", "4eme", "3eme"].includes(level)) return "college";
      return "lycee";
    }

    function getInitialLevel() {
      const params = new URLSearchParams(window.location.search);
      return params.get("level") || localStorage.getItem("studentLevel") || "6eme";
    }

    let currentLevel = getInitialLevel();
    let activeBranch = null;

    function slug(value) {
      return value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    }

    function getBranches() {
      return branchTemplates[profileForLevel(currentLevel)];
    }

    function render() {
      const branches = getBranches();
      activeBranch = activeBranch && branches.some((branch) => branch.key === activeBranch)
        ? activeBranch
        : branches[0].key;

      document.getElementById("levelSelect").value = currentLevel;
      document.getElementById("pageTitle").textContent = `Cours de francais - Niveau ${levels[currentLevel]}`;
      document.getElementById("pageIntro").textContent = `Parcours adapte au niveau ${levels[currentLevel]} avec branches, sous-branches, resumes et exercices.`;
      renderBranchTabs(branches);
      renderBranch(branches.find((branch) => branch.key === activeBranch));
    }

    function renderBranchTabs(branches) {
      const tabs = document.getElementById("branchTabs");
      tabs.innerHTML = "";

      branches.forEach((branch) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = branch.key === activeBranch ? "active" : "";
        button.innerHTML = `<i class="fas ${branch.icon}"></i> ${branch.title}`;
        button.addEventListener("click", () => {
          activeBranch = branch.key;
          render();
        });
        tabs.appendChild(button);
      });
    }

    function renderBranch(branch) {
      const nav = document.getElementById("chapterNav");
      const content = document.getElementById("courseContent");
      nav.innerHTML = "";

      if (!branch) {
        content.innerHTML = `<div class="empty">Aucun contenu disponible pour ce niveau.</div>`;
        return;
      }

      branch.chapters.forEach((chapterItem, index) => {
        const id = `${branch.key}-${slug(chapterItem.title)}`;
        const link = document.createElement("a");
        link.href = `#${id}`;
        link.textContent = `${index + 1}. ${chapterItem.title}`;
        nav.appendChild(link);
      });

      content.innerHTML = `
        <article class="branch-panel">
          <div class="branch-heading">
            <div>
              <p class="panel-kicker">Branche</p>
              <h2>${branch.title}</h2>
            </div>
            <i class="fas ${branch.icon}"></i>
          </div>
          <div class="subbranch-list">
            ${branch.subbranches.map((item) => `<span>${item}</span>`).join("")}
          </div>
          <div class="chapter-stack">
            ${branch.chapters.map((chapterItem, index) => renderChapter(branch, chapterItem, index)).join("")}
          </div>
        </article>
      `;
    }

    function renderChapter(branch, chapterItem, index) {
      const id = `${branch.key}-${slug(chapterItem.title)}`;
      const summaryId = `${id}-summary`;
      return `
        <section class="chapter-card" id="${id}">
          <div class="chapter-top">
            <div>
              <p class="panel-kicker">Chapitre ${index + 1}</p>
              <h3>${chapterItem.title}</h3>
              <p>${chapterItem.goal}</p>
            </div>
            <button class="primary-btn" type="button" onclick="toggleSummary('${summaryId}')">Resume du cours</button>
          </div>
          <div class="summary" id="${summaryId}">
            <ul>
              ${chapterItem.summary.map((item) => `<li>${item}</li>`).join("")}
            </ul>
          </div>
          <div class="chapter-actions">
            <button class="light-btn" type="button" onclick="toggleExercises('${id}-exercises')">Voir 3 exercices</button>
          </div>
          <ol class="exercise-list summary" id="${id}-exercises">
            ${chapterItem.exercises.map((exercise, exerciseIndex) => `<li><strong>Exercice ${exerciseIndex + 1}.</strong> ${exercise}</li>`).join("")}
          </ol>
        </section>
      `;
    }

    function toggleSummary(id) {
      document.getElementById(id)?.classList.toggle("open");
    }

    function toggleExercises(id) {
      document.getElementById(id)?.classList.toggle("open");
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      document.getElementById("theme-icon").className = isDark ? "fas fa-sun" : "fas fa-moon";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        document.getElementById("theme-icon").className = "fas fa-sun";
      }

      document.getElementById("levelSelect").addEventListener("change", (event) => {
        currentLevel = event.target.value;
        localStorage.setItem("studentLevel", currentLevel);
        activeBranch = null;
        const url = new URL(window.location.href);
        url.searchParams.set("level", currentLevel);
        window.history.replaceState({}, "", url);
        render();
      });

      localStorage.setItem("studentLevel", currentLevel);
      render();
    });
  </script>
</body>
</html>
